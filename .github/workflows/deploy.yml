name: Deploy

# Manual trigger only — a bad build should never reach production just because
# someone pushed to main. Requires AZURE_CREDENTIALS, ACR_NAME and
# AZURE_RESOURCE_GROUP repository secrets (see docs/DEPLOYMENT.md); the job
# fails fast with a clear message if they're missing rather than partially
# deploying.
on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are configured
        run: |
          missing=""
          [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] && missing="$missing AZURE_CREDENTIALS"
          [ -z "${{ secrets.ACR_NAME }}" ] && missing="$missing ACR_NAME"
          [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ] && missing="$missing AZURE_RESOURCE_GROUP"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing — see docs/DEPLOYMENT.md step 5"
            exit 1
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-secrets
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/atms-api:${{ steps.tag.outputs.tag }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/atms-api:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/atms-api:${{ steps.tag.outputs.tag }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/atms-api:latest

      # Next.js bakes rewrites() destinations into the build at `next build` time —
      # a runtime Container App env var has no effect on it (verified locally: a
      # container started with a different API_INTERNAL_URL than its build-time
      # value still proxies to the build-time one). The api Container App already
      # exists from the infra deployment (DEPLOYMENT.md step 3), so its FQDN is
      # queryable here and gets baked into the web image as the proxy target.
      - name: Look up the API Container App's public FQDN
        id: api-fqdn
        uses: azure/CLI@v2
        with:
          inlineScript: |
            fqdn=$(az containerapp show \
              --name atms-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg API_INTERNAL_URL=${{ steps.api-fqdn.outputs.url }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/atms-web:${{ steps.tag.outputs.tag }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/atms-web:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/atms-web:${{ steps.tag.outputs.tag }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/atms-web:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update API Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name atms-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_NAME }}.azurecr.io/atms-api:${{ needs.build-and-push.outputs.image-tag }}

      - name: Update web Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name atms-web \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_NAME }}.azurecr.io/atms-web:${{ needs.build-and-push.outputs.image-tag }}

      # WEB_ORIGIN (used for CORS + the auth cookie's allowed origin) is a plain
      # runtime env var on the API side, unlike the web image's build-time proxy
      # target above — CORS is checked per-request, not baked in. Both apps' real
      # FQDNs are only known after the first `az deployment group create`, so this
      # keeps the api container's CORS allow-list correct even if the `webOrigin`
      # Bicep parameter was a best guess at initial infra deploy time.
      - name: Sync WEB_ORIGIN to the web Container App's actual FQDN
        uses: azure/CLI@v2
        with:
          inlineScript: |
            web_fqdn=$(az containerapp show \
              --name atms-web \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            az containerapp update \
              --name atms-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --set-env-vars WEB_ORIGIN="https://$web_fqdn"
